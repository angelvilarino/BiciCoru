name: 🔮 Generar Predicciones

on:
  schedule:
    - cron: '0 */2 * * *'  # Se ejecuta cada 2 horas (ej: 14:00, 16:00...)
  workflow_dispatch:      # Botón manual

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        # Esto ahora será rapidísimo sin Darts
        run: pip install -r data_engine/requirements.txt
      
      - name: Generate predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python data_engine/predictor.py