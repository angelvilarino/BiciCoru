name: 🔮 Generar Predicciones

on:
  schedule:
    - cron: '0 */2 * * *'  # Se ejecuta cada 2 horas
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r data_engine/requirements.txt
      
      - name: Generate predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        # ASEGÚRATE DE QUE EL NOMBRE DEL ARCHIVO COINCIDE CON EL QUE TIENES EN TU CARPETA
        # Si tu archivo se llama predictor.py, usa esta línea:
        run: python data_engine/predictor.py