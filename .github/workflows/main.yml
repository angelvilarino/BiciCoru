name: Deploy BiciCoruna to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CAMBIO 1: Indicamos la ruta correcta (web/logic.js)
      - name: Inject Supabase Keys
        run: |
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${{ secrets.VITE_SUPABASE_URL }}|g" web/logic.js
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${{ secrets.VITE_SUPABASE_KEY }}|g" web/logic.js

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # CAMBIO 2: Indicamos que la web está dentro de la carpeta 'web'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
