name: 🤖 Reentrenar Modelo

on:
  schedule:
    - cron: '0 3 * * 0'  # Domingos a las 3 AM UTC (Madrugada)
  workflow_dispatch:      # Botón manual para forzar reentreno

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Bajado de 30 a 20 porque V11 es muy rápido
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r data_engine/requirements.txt

      - name: Validate model pipeline
        run: python -m unittest data_engine.test_prediction_pipeline -v
      
      - name: Train model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_engine/train_model.py
      
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: data_engine/models_v22/models.pkl
          if-no-files-found: error
          retention-days: 14