name: 🤖 Reentrenar Modelo

on:
  schedule:
    - cron: '0 3 * * 0'  # Domingos a las 3 AM UTC (Madrugada)
  workflow_dispatch:      # Botón manual para forzar reentreno

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Bajado de 30 a 20 porque V11 es muy rápido
    
    permissions:
      contents: write # IMPORTANTE: Permiso para hacer git push
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r data_engine/requirements.txt
      
      - name: Train model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_engine/train_model.py
      
      - name: Commit updated model
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Añadimos solo el archivo .pkl
          git add data_engine/models_advanced.pkl
          
          # Si no hay cambios (el modelo es idéntico), no fallar
          git commit -m "🤖 Modelo reentrenado automáticamente" || echo "No changes to commit"
          
          # TRUCO PRO: Traer cambios remotos antes de subir para evitar conflictos
          git pull --rebase origin main
          
          git push