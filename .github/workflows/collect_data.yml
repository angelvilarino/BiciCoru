name: 📥 Recolectar Datos

on:
  schedule:
    # 🚴 Cada 10 minutos durante el día (07:00 a 01:00 hora local / 05:00 a 23:00 UTC)
    - cron: '*/10 5-23 * * *'
    # 🌙 Cada hora durante la madrugada (01:00 a 07:00 hora local / 00:00 a 04:00 UTC)
    - cron: '0 0-4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r data_engine/requirements.txt
      
      - name: Collect data
        env:
          # Usamos explícitamente la SERVICE KEY para tener permisos de escritura
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python data_engine/collector.py