name: Coruña Flow Scraper

on:
  schedule:
    # Se ejecuta cada hora (a los 0 minutos)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install -r data_pipeline/requirements.txt

      - name: Ejecutar Scraper
        env:
          # Aquí conectamos los secretos de GitHub con tu código
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python data_pipeline/main_scraper.py