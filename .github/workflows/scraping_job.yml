name: Hourly Ocupacion Scraper

on:
  schedule:
    - cron: '0 * * * *'  # Se ejecuta cada hora en punto (:00)
  workflow_dispatch:      # Permite ejecutarlo manualmente desde el botón en GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install supabase requests livepopulartimes

      - name: Ejecutar Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python data_pipeline/scraper.py