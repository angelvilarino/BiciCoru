name: Hourly Ocupacion Scraper

on:
  schedule:
    # Se ejecuta cada hora en punto, desde las 08:00 hasta las 23:00 (UTC)
    # OJO: GitHub usa hora UTC. España es UTC+1 (Invierno). 
    # Para que empiece a las 08:00 hora Coruña, ponemos '7-22'
    - cron: '0 7-22 * * *'  
  workflow_dispatch:    # Permite ejecutarlo manualmente desde el botón en GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install supabase requests livepopulartimes

      - name: Ejecutar Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python data_pipeline/scraper.py