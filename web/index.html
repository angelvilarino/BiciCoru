<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiciCoruña AI</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <div id="route-panel" class="route-panel hidden">
            <span class="route-icon">🚶</span>
            <div class="route-data">
                <span id="route-time" class="route-time">-- min</span>
                <span id="route-dist" class="route-dist">-- km</span>
            </div>
            <button id="btn-stop-route" class="close-route-btn">✕</button>
        </div>

        <div class="top-controls">
            <div class="app-header">
                <div class="brand">
                    <h1>🚲 BiciAI</h1>
                    <div class="weather-mini" id="weather-display">☁️ --°C</div>
                </div>
                <button id="btn-dark-mode" class="theme-btn">🌙</button>
            </div>

            <div class="search-floating">
                <input type="text" id="search-input" placeholder="🔍 Buscar estación..." autocomplete="off">
                <button id="btn-geo" class="icon-btn" title="Mi ubicación">📍</button>
            </div>

            <div class="filters-scroll">
                <button class="filter-chip active" data-filter="all">Todas</button>
                <button class="filter-chip" data-filter="bikes">Necesito Bici</button>
                <button class="filter-chip" data-filter="slots">Necesito Aparcar</button>
            </div>
        </div>

        <aside class="station-card hidden" id="station-card">
            <div class="drag-handle"></div>
            
            <div class="card-content" id="station-details">
                <div class="station-header-row">
                    <div>
                        <h3 class="station-title" id="station-name">Estación</h3>
                        <span class="station-subtitle" id="station-status">--</span>
                    </div>
                    <div class="station-capacity-badge" id="station-capacity">Cap: --</div>
                </div>

                <div class="kpi-row">
                    <div class="mini-kpi">
                        <span class="val" id="st-bikes">-</span> 
                        <span class="lbl">Bicis Disponibles</span>
                    </div>
                    <div class="mini-kpi">
                        <span class="val" id="st-slots">-</span> 
                        <span class="lbl">Huecos Libres</span>
                    </div>
                </div>

                <div class="ai-planning-card" id="ai-card">
                    <div class="ai-header">
                        <span class="ai-icon">✨</span>
                        <div class="ai-title"><strong>Planificador IA</strong></div>
                    </div>
                    
                    <div class="ai-actions">
                        <button id="btn-plan-trip" class="ai-action-btn primary">
                            <span>🔮 ¿Habrá sitio?</span>
                        </button>
                        <button id="btn-draw-route" class="ai-action-btn secondary">
                            <span>📍 Ver Ruta</span>
                        </button>
                    </div>

                    <div id="trip-result" class="trip-result hidden">
                        <div class="loading-spinner hidden" id="trip-loader"><div class="spinner"></div> Calculando...</div>
                        <div id="trip-content"></div>
                    </div>
                </div>

                <div class="charts-scroll">
                    <div class="chart-box">
                        <h4>📉 Historial (24h)</h4>
                        <canvas id="historyChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <h4>🔮 Predicción (Futura)</h4>
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>
        </aside>

        <main id="map"></main>

        <div class="map-legend">
            <div class="legend-item"><div class="legend-color" style="background:#2ecc71"></div><span>5+</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#f39c12"></div><span>1-4</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#e74c3c"></div><span>0</span></div>
        </div>
        <div class="toast" id="toast"><span id="toast-message"></span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="logic.js"></script>
</body>
</html>
